<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Removal Agency - Delivery Estimator</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="overlay"></div>

    <main class="container">
        <header class="hero">
            <h1>Ghost Delivery Estimator</h1>
            <p>Calculate your ghost relocation and removal service charges.</p>
        </header>

        <form id="kioskForm" onsubmit="return validateAndCalculate(event)">
            <!-- 1. Customer Name -->
            <div class="form-group">
                <label for="custName">Customer Full Name:</label>
                <input type="text" id="custName" placeholder="Enter your full name">
                <div id="nameError" class="text-danger"></div>
            </div>

            <!-- 2. Customer Email -->
            <div class="form-group">
                <label for="custEmail">Customer Email Address:</label>
                <input type="email" id="custEmail" placeholder="you@example.com">
                <div id="emailError" class="text-danger"></div>
            </div>

            <!-- 3. Relocation Destination -->
            <div class="form-group">
                <label for="destination">Relocation Destination:</label>
                <select id="destination">
                    <option value="">-- Select Destination --</option>
                    <option value="city">City Area (RM 50.00)</option>
                    <option value="rural">Rural Area (RM 100.00)</option>
                    <option value="haunted">Remote Haunted House (RM 200.00)</option>
                </select>
                <div id="destError" class="text-danger"></div>
            </div>

            <!-- 4. Ghost Weight Tier -->
            <div class="form-group">
                <label for="ghostWeight">Ghost Weight Tier & Handling Fee:</label>
                <select id="ghostWeight">
                    <option value="">-- Select Weight Tier --</option>
                    <option value="5">Light Entity (1 - 5 kg) - RM 20.00</option>
                    <option value="20">Medium Entity (6 - 20 kg) - RM 50.00</option>
                    <option value="50">Heavy Entity (21 - 50 kg) - RM 100.00</option>
                    <option value="51">Ultra Heavy Entity (> 50 kg) - RM 150.00</option>
                </select>
                <div id="weightError" class="text-danger"></div>
            </div>

            <!-- 5. Delivery Speed -->
            <div class="form-group">
                <label for="speed">Delivery Speed:</label>
                <select id="speed">
                    <option value="">-- Select Speed --</option>
                    <option value="standard">Standard Response (24 Hours) (RM 0.00)</option>
                    <option value="express">Emergency Express (1-Hour) (RM 100.00)</option>
                </select>
                <div id="speedError" class="text-danger"></div>
            </div>

            <!-- 6. Terms & Conditions -->
            <div class="form-group checkbox-group">
                <label for="terms">
                    <input type="checkbox" id="terms"> I agree to the Ghost Relocation Terms & Conditions
                </label>
                <div id="termsError" class="text-danger"></div>
            </div>

            <button type="submit" class="btn-submit">Calculate Delivery Fee</button>
        </form>

        <!-- Dynamic Result Display Box -->
        <div id="resultDisplay" class="result-box hidden"></div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
